name: tadabbur
description: "AI-first Quranic Arabic learning app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management — see docs/flutter-architecture.md for why Riverpod
  flutter_riverpod: ^2.6.1

  # Navigation — declarative routing, integrates cleanly with Riverpod for
  # auth-gated redirects (unauthenticated users bounced to onboarding)
  go_router: ^14.6.2

  # Backend client — Supabase Auth, Postgres (via PostgREST), Storage, Edge Functions
  supabase_flutter: ^2.8.0

  # Local .env loading (Supabase URL/anon key) — never commit the .env file itself
  flutter_dotenv: ^5.2.1

  # On-device prayer time calculation (Prayer Times tab) — computes from
  # coordinates + date locally, no network call, matching the app's
  # offline-first direction rather than depending on a prayer-times API.
  adhan_dart: ^2.0.1

  # Device GPS position for prayer time calculation, with a manual
  # city-picker fallback (see features/prayer_times) when denied/unavailable.
  geolocator: ^14.0.3

  # Persists the user's chosen prayer-time location (GPS vs manual city)
  # across launches. Already pulled in transitively by supabase_flutter;
  # declared directly here since prayer_times imports it itself.
  shared_preferences: ^2.5.5

  # Hijri calendar conversion for the date kicker on Learn and Prayer.
  # Tabular/arithmetic conversion done locally, consistent with the
  # offline-first stance already taken for prayer times.
  hijri: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Mocking for unit tests (see testing-strategy.md)
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - .env
    # The SIL Open Font License requires the licence text to travel with any
    # redistributed copy of the fonts, so it ships in the bundle rather than
    # sitting in the repo only. The .ttf files themselves are declared under
    # `fonts:` below — listing the directory here instead would bundle every
    # face twice.
    - assets/fonts/OFL-Lora.txt
    - assets/fonts/OFL-WorkSans.txt
    - assets/fonts/OFL-AmiriQuran.txt

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Typography — Lora (English UI voice), Work Sans (numerals, micro-labels,
  # buttons), Amiri Quran (all diacritized Arabic). See
  # lib/core/theme/app_typography.dart for which family carries which job.
  #
  # These were fetched at runtime by the `google_fonts` package until the M8
  # offline-hardening milestone (implementation-plan.md). Bundling them locally
  # takes typography off the network entirely: first paint no longer waits on a
  # download, and an offline launch still renders Amiri Quran's Tashkeel rather
  # than falling back to a system face that cannot position the marks.
  #
  # Every face here is a static instance cut from the upstream Google Fonts
  # variable source at a weight the app actually asks for — Flutter resolves a
  # bundled family by nearest declared weight and will not interpolate a
  # variable axis on its own, so each used weight needs its own file. Adding a
  # weight to this list without a call site that requests it is dead bundle
  # weight; conversely, requesting a weight that is not listed silently renders
  # at the nearest one.
  fonts:
    # w400 display/emphasis and the body styles in AppTypography.textTheme();
    # w500 is what Material's own text geometry asks for on titleMedium and
    # titleSmall, which textTheme() passes through untouched. Italic is the
    # coloured clause inside a display title (AppTypography.emphasis).
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 400
          style: italic
    # w400 form hint/label text, w500 the AppTypography.label default, w600
    # eyebrows plus the numeric default and labelLarge, w700 the tab-bar badge
    # count. No italic: nothing reaches for a sloped sans.
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    # Single-weight family upstream, and the app only ever asks for regular.
    # The one file carries both the Arabic and Latin subsets, so mixed-script
    # runs inside a single Text() stay in one face.
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
